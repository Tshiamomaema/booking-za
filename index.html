<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DebtTracker</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0F172A', // Slate 900
                        primaryHover: '#1E293B', // Slate 800
                        secondary: '#059669', // Emerald 600
                        danger: '#E11D48', // Rose 600
                        background: '#F8FAFC', // Slate 50
                        surface: '#FFFFFF',
                        backgroundDark: '#0F172A', // Slate 900
                        surfaceDark: '#1E293B', // Slate 800
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background text-slate-800 dark:bg-backgroundDark dark:text-slate-200 transition-colors duration-200 h-screen overflow-hidden flex flex-col md:flex-row antialiased tabular-nums">

    <!-- Mobile Header -->
    <header class="md:hidden bg-surface dark:bg-surfaceDark border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex justify-between items-center z-10 shrink-0">
        <h1 class="text-lg font-bold text-slate-900 dark:text-white tracking-tight">DebtTracker</h1>
        <button id="theme-toggle-mobile" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:block"></i>
        </button>
    </header>

    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex flex-col w-64 bg-surface dark:bg-surfaceDark border-r border-slate-200 dark:border-slate-800 z-10 shrink-0">
        <div class="p-6 flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">DebtTracker</h1>
            <button id="theme-toggle-desktop" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:block"></i>
            </button>
        </div>
        <nav class="flex-1 px-4 space-y-1" id="desktop-nav">
            <a href="#" data-target="view-dashboard" class="nav-link flex items-center p-3 rounded-lg text-sm font-medium transition-colors text-slate-600 hover:bg-slate-50 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800/50 dark:hover:text-white active"><i class="fas fa-chart-line w-5 mr-3 text-center"></i> Dashboard</a>
            <a href="#" data-target="view-customers" class="nav-link flex items-center p-3 rounded-lg text-sm font-medium transition-colors text-slate-600 hover:bg-slate-50 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800/50 dark:hover:text-white"><i class="fas fa-users w-5 mr-3 text-center"></i> Customers</a>
            <a href="#" data-target="view-catalog" class="nav-link flex items-center p-3 rounded-lg text-sm font-medium transition-colors text-slate-600 hover:bg-slate-50 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800/50 dark:hover:text-white"><i class="fas fa-box-open w-5 mr-3 text-center"></i> Catalog</a>
            <a href="#" data-target="view-settings" class="nav-link flex items-center p-3 rounded-lg text-sm font-medium transition-colors text-slate-600 hover:bg-slate-50 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800/50 dark:hover:text-white"><i class="fas fa-cog w-5 mr-3 text-center"></i> Settings</a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto relative pb-20 md:pb-0" id="main-content">
        <!-- Views will be injected or toggled here -->

        <!-- View: Dashboard -->
        <section id="view-dashboard" class="view px-4 py-8 md:p-10 active-view max-w-6xl mx-auto">
            <h2 class="text-3xl font-bold text-slate-900 dark:text-white mb-8 tracking-tight">Dashboard</h2>
            <!-- Content built by JS -->
            <div id="dashboard-content"></div>
        </section>

        <!-- View: Customers -->
        <section id="view-customers" class="view px-4 py-8 md:p-10 hidden max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Customers</h2>
                <button class="bg-primary hover:bg-primaryHover text-white px-5 py-2.5 rounded-full text-sm font-semibold transition-colors shadow-sm" onclick="app.showAddCustomerModal()"><i class="fas fa-plus mr-2"></i> Add</button>
            </div>
            <!-- Content built by JS -->
            <div id="customers-content"></div>
        </section>

        <!-- View: Catalog -->
        <section id="view-catalog" class="view px-4 py-8 md:p-10 hidden max-w-5xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Product Catalog</h2>
                <button class="bg-primary hover:bg-primaryHover text-white px-5 py-2.5 rounded-full text-sm font-semibold transition-colors shadow-sm" onclick="app.showAddProductModal()"><i class="fas fa-plus mr-2"></i> Add</button>
            </div>
            <!-- Content built by JS -->
            <div id="catalog-content"></div>
        </section>

        <!-- View: Settings -->
        <section id="view-settings" class="view px-4 py-8 md:p-10 hidden max-w-2xl mx-auto">
            <h2 class="text-3xl font-bold text-slate-900 dark:text-white mb-8 tracking-tight">Settings</h2>
            <!-- Content built by JS -->
            <div id="settings-content"></div>
        </section>

        <!-- View: Customer Details (Sub-view) -->
        <section id="view-customer-details" class="view px-4 py-8 md:p-10 hidden bg-background dark:bg-backgroundDark absolute inset-0 z-20 overflow-y-auto">
            <div class="max-w-3xl mx-auto">
                <div class="flex items-center mb-8">
                    <button class="text-slate-400 hover:text-slate-900 dark:hover:text-white mr-4 text-xl transition-colors" onclick="app.navigate('view-customers')"><i class="fas fa-arrow-left"></i></button>
                    <h2 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight truncate" id="detail-customer-name">Customer Details</h2>
                </div>
                <div id="customer-details-content"></div>
            </div>
        </section>

    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="md:hidden bg-surface dark:bg-surfaceDark border-t border-slate-200 dark:border-slate-800 flex justify-around px-2 py-3 pb-safe absolute bottom-0 w-full z-30 shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.1)]" id="mobile-nav">
        <a href="#" data-target="view-dashboard" class="nav-link flex flex-col items-center p-2 text-slate-900 dark:text-white">
            <i class="fas fa-chart-line text-xl mb-1"></i>
            <span class="text-[10px] font-semibold tracking-wide uppercase">Home</span>
        </a>
        <a href="#" data-target="view-customers" class="nav-link flex flex-col items-center p-2 text-slate-400 hover:text-slate-900 dark:text-slate-500 dark:hover:text-white transition-colors">
            <i class="fas fa-users text-xl mb-1"></i>
            <span class="text-[10px] font-semibold tracking-wide uppercase">Clients</span>
        </a>
        <a href="#" data-target="view-catalog" class="nav-link flex flex-col items-center p-2 text-slate-400 hover:text-slate-900 dark:text-slate-500 dark:hover:text-white transition-colors">
            <i class="fas fa-box-open text-xl mb-1"></i>
            <span class="text-[10px] font-semibold tracking-wide uppercase">Catalog</span>
        </a>
        <a href="#" data-target="view-settings" class="nav-link flex flex-col items-center p-2 text-slate-400 hover:text-slate-900 dark:text-slate-500 dark:hover:text-white transition-colors">
            <i class="fas fa-cog text-xl mb-1"></i>
            <span class="text-[10px] font-semibold tracking-wide uppercase">Settings</span>
        </a>
    </nav>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <!-- Scripts -->
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
